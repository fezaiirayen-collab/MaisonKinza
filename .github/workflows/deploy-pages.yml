name: Deploy KENZA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer les dependances du tableau de bord
        run: npm ci --prefix admin-portal
      - name: Vérifier la configuration Supabase
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /MaisonKinza/
      - name: Vérifier TypeScript
        run: npm run typecheck
      - name: Vérifier le lint
        run: npm run lint
      - name: Verifier le tableau de bord
        run: |
          npm run typecheck --prefix admin-portal
          npm run lint --prefix admin-portal
      - name: Construire la boutique
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /MaisonKinza/
      - name: Préparer le fallback des routes React
        run: cp dist/index.html dist/404.html
      - name: Construire le tableau de bord
        run: npm run build --prefix admin-portal
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ADMIN_BASE_PATH: /MaisonKinza/vrai-admin/
      - name: Ajouter le tableau de bord a GitHub Pages
        run: |
          mkdir -p dist/vrai-admin
          cp -R admin-portal/dist/. dist/vrai-admin/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
